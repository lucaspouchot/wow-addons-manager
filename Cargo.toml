[package]
name = "wow-addons-manager"
version = "0.1.1"
edition = "2024"
rust-version = "1.89"
description = "Check and update World of Warcraft addons from the command line"
repository = "https://github.com/lucaspouchot/wow-addons-manager"

[[bin]]
name = "wowaddons"
path = "src/main.rs"

[lib]
name = "wow_addons_manager"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive", "env"] }
comfy-table = "8.0.1"
dirs = "7.0.0"
fs4 = { version = "1.1.0", features = ["sync"] }
futures-util = "0.3.34"
hex = "0.4.3"
indicatif = "0.18.6"
keyring = "4.2"
reqwest = { version = "0.13.5", default-features = false, features = [
  "rustls",
  "stream",
  "json",
  "http2",
] }
rpassword = "7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = [
  "serde",
  "formatting",
  "parsing",
  "macros",
] }
tokio = { version = "1.54.1", features = [
  "rt-multi-thread",
  "macros",
  "fs",
  "io-util",
  "time",
  "sync",
  "signal",
] }
toml = "1.1.8"
toml_edit = "0.25.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zip = { version = "9.3.0", default-features = false, features = ["deflate"] }

[build-dependencies]
# Windows version information and manifest, see build.rs.
winresource = "0.1.34"

[dev-dependencies]
wiremock = "0.6.5"
